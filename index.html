<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a0b10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Gym Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20261006-mobile1">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="logo">GP</div>
      <div>
        <strong>Gym Planner</strong>
        <span id="todayLabel"></span>
      </div>
    </header>

    <main>
      <section class="page active" id="home">
        <div class="section-title"><h1>Today</h1><span id="weekCount"></span></div>
        <article class="next-card" id="nextCard">
          <div>
            <span class="small" id="nextDay"></span>
            <h2 id="nextTitle">Loading…</h2>
            <p id="nextDetail"></p>
          </div>
          <button class="primary" id="startNext">Start</button>
        </article>

        <div class="stats">
          <div><span>Week</span><strong id="statWeek">0/4</strong></div>
          <div><span>Workouts</span><strong id="statSessions">0</strong></div>
          <div><span>Run miles</span><strong id="statMiles">0.0</strong></div>
          <div><span>Goals</span><strong id="statGoals">0%</strong></div>
        </div>

        <article class="panel">
          <div class="panel-head"><h3>12-week progress</h3><span>Actual vs target</span></div>
          <div class="chart-wrap"><canvas id="progressChart"></canvas></div>
        </article>

        <article class="panel">
          <div class="panel-head"><h3>This week</h3><button class="link-btn" data-go="plan">View plan</button></div>
          <div id="weekList" class="week-list"></div>
        </article>
      </section>

      <section class="page" id="plan">
        <div class="section-title"><h1>Plan</h1><div class="week-nav"><button id="prevWeek">‹</button><span id="weekLabel">This week</span><button id="nextWeek">›</button></div></div>
        <div id="planList" class="plan-list"></div>
      </section>

      <section class="page" id="goals">
        <div class="section-title"><h1>Goals</h1><span>12 weeks</span></div>
        <div class="tabs"><button class="active" data-goal-tab="strength">Strength</button><button data-goal-tab="running">Running</button></div>
        <div id="goalList" class="goal-list"></div>
      </section>

      <section class="page" id="history">
        <div class="section-title"><h1>History</h1><button class="link-btn" id="exportData">Export</button></div>
        <div id="historyList" class="history-list"></div>
      </section>
    </main>

    <nav class="bottom-nav">
      <button class="active" data-page="home"><span>⌂</span>Home</button>
      <button data-page="plan"><span>▤</span>Plan</button>
      <button data-page="goals"><span>◎</span>Goals</button>
      <button data-page="history"><span>◷</span>History</button>
    </nav>
  </div>

  <div class="session" id="session">
    <header class="session-top">
      <button class="icon-btn" id="closeSession">‹</button>
      <div>
        <strong id="sessionTitle"></strong>
        <span id="sessionDate"></span>
      </div>
      <span id="sessionPct">0%</span>
    </header>
    <div class="session-progress"><span id="sessionProgress"></span></div>
    <div id="sessionBody" class="session-body"></div>
    <div class="session-bottom">
      <button class="primary full" id="finishSession">Finish session</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="app.js?v=20261006-mobile1"></script>
</body>
</html>
